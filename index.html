<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANA BEATRIZ — Protocolo Dermal</title>

  <!-- Fonts: Clash Display (brutalista) + Space Mono (laboratorial) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@700,600,500&display=swap" rel="stylesheet" />

  <style>
    /* ═══════════════════════════════════════════════════
       DESIGN TOKENS — CSS CUSTOM PROPERTIES
    ═══════════════════════════════════════════════════ */
    :root {
      /* Vantablack Core */
      --void:          #050505;
      --void-deep:     #000000;

      /* Iridescent Palette */
      --cyan:          #00FFEE;
      --cyan-dim:      #00CCBBaa;
      --magenta:       #FF00AA;
      --magenta-dim:   #CC008888;
      --violet:        #7B2FFF;
      --silver:        #B8C6DB;
      --silver-bright: #E8F0FE;

      /* Holographic Gradients */
      --grad-holo:     linear-gradient(135deg, #00FFEE 0%, #7B2FFF 40%, #FF00AA 70%, #B8C6DB 100%);
      --grad-holo-rev: linear-gradient(135deg, #B8C6DB 0%, #FF00AA 30%, #7B2FFF 60%, #00FFEE 100%);
      --grad-glow:     radial-gradient(ellipse at center, #00FFEE22 0%, transparent 70%);

      /* Typography */
      --font-display:  'Clash Display', 'Bebas Neue', 'Impact', sans-serif;
      --font-mono:     'Space Mono', 'Courier New', monospace;

      /* Easing */
      --ease-expo:     cubic-bezier(0.16, 1, 0.3, 1);
      --ease-quart:    cubic-bezier(0.77, 0, 0.175, 1);
      --ease-elastic:  cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ═══════════════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════════════ */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { overflow: hidden; }

    body {
      background: var(--void);
      color: var(--silver-bright);
      font-family: var(--font-mono);
      overflow: hidden;
      cursor: none;
      height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ═══════════════════════════════════════════════════
       CUSTOM CURSOR
    ═══════════════════════════════════════════════════ */
    #cursor-dot {
      position: fixed;
      width: 5px;
      height: 5px;
      background: var(--cyan);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      left: 0; top: 0;
      transform: translate(-50%, -50%);
      transition: opacity 0.2s, width 0.25s var(--ease-expo), height 0.25s var(--ease-expo);
      mix-blend-mode: difference;
    }

    #cursor-ring {
      position: fixed;
      width: 30px;
      height: 30px;
      border: 1px solid rgba(0, 255, 238, 0.55);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9998;
      left: 0; top: 0;
      transform: translate(-50%, -50%);
      transition:
        width  0.45s var(--ease-expo),
        height 0.45s var(--ease-expo),
        border-color 0.3s ease,
        background  0.3s ease,
        box-shadow  0.3s ease;
    }

    /* — Cursor hovering a magnetic target — */
    body.cursor-on-cta #cursor-dot {
      opacity: 0;
      width: 0;
      height: 0;
    }
    body.cursor-on-cta #cursor-ring {
      width: 80px;
      height: 80px;
      border-color: var(--cyan);
      border-width: 1.5px;
      background: rgba(0, 255, 238, 0.04);
      box-shadow: 0 0 24px rgba(0, 255, 238, 0.18),
                  inset 0 0 24px rgba(0, 255, 238, 0.06);
    }

    /* ═══════════════════════════════════════════════════
       NOISE TEXTURE OVERLAY
    ═══════════════════════════════════════════════════ */
    .noise {
      position: fixed;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 300px 300px;
    }

    /* ═══════════════════════════════════════════════════
       HERO SECTION  (isolation context for mix-blend-mode)
    ═══════════════════════════════════════════════════ */
    #hero {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      isolation: isolate; /* mix-blend-mode operates inside this context */
    }

    /* ─ WebGL canvas: sits at z-index 0 inside hero ─ */
    #canvas-fluid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* ─ Scanlines ─ */
    #hero::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.04) 3px,
        rgba(0,0,0,0.04) 4px
      );
      pointer-events: none;
    }

    /* ─ Radial vignette ─ */
    #hero::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 2;
      background: radial-gradient(
        ellipse 80% 90% at 50% 50%,
        transparent 30%,
        rgba(0,0,0,0.75) 100%
      );
      pointer-events: none;
    }

    /* ═══════════════════════════════════════════════════
       HERO INNER LAYOUT
    ═══════════════════════════════════════════════════ */
    .hero-inner {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100%;
      padding: clamp(1.5rem, 4vh, 3rem) clamp(1.5rem, 6vw, 7rem);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* ═══════════════════════════════════════════════════
       HERO LABEL  — top metadata line
    ═══════════════════════════════════════════════════ */
    .hero-label {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin-bottom: clamp(1.5rem, 3vh, 2.5rem);
      opacity: 0;
      transform: translateY(-10px);
    }

    .hero-label span {
      font-family: var(--font-mono);
      font-size: clamp(0.5rem, 0.75vw, 0.68rem);
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(0, 255, 238, 0.65);
    }

    .label-rule {
      display: block;
      width: clamp(2rem, 3.5vw, 4rem);
      height: 1px;
      background: var(--grad-holo);
      flex-shrink: 0;
    }

    .label-dot {
      display: block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 6px var(--cyan);
      flex-shrink: 0;
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 6px var(--cyan); }
      50%       { opacity: 0.4; box-shadow: 0 0 2px var(--cyan); }
    }

    /* ═══════════════════════════════════════════════════
       HERO NAME  — colossal brutalist typography
    ═══════════════════════════════════════════════════ */
    .hero-name {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(4.5rem, 14.5vw, 17rem);
      line-height: 0.88;
      letter-spacing: -0.025em;
      text-transform: uppercase;
      color: var(--silver-bright);
      mix-blend-mode: exclusion;  /* text color inverts against fluid highlights */
      margin-bottom: clamp(1.5rem, 3.5vh, 3rem);
      user-select: none;
    }

    .hero-name .line {
      display: block;
      overflow: hidden;
    }

    .hero-name .line-inner {
      display: block;
      transform: translateY(110%);
      will-change: transform;
    }

    /* Second line: slightly indented for dynamic tension */
    .hero-name .line:nth-child(2) .line-inner {
      padding-left: clamp(0.5rem, 2vw, 3rem);
    }

    /* ═══════════════════════════════════════════════════
       HERO META  — descriptor + tagline
    ═══════════════════════════════════════════════════ */
    .hero-meta {
      margin-bottom: clamp(2.5rem, 5vh, 5rem);
    }

    .hero-descriptor {
      font-family: var(--font-mono);
      font-size: clamp(0.6rem, 0.9vw, 0.8rem);
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: rgba(184, 198, 219, 0.5);
      margin-bottom: 0.55rem;
      opacity: 0;
      transform: translateY(8px);
    }

    .hero-tagline {
      font-family: var(--font-mono);
      font-size: clamp(0.65rem, 1.1vw, 0.9rem);
      letter-spacing: 0.14em;
      color: rgba(184, 198, 219, 0.28);
      opacity: 0;
      transform: translateY(8px);
    }

    /* ═══════════════════════════════════════════════════
       CTA MAGNETIC BUTTON
    ═══════════════════════════════════════════════════ */
    .cta-wrap {
      opacity: 0;
      transform: translateY(12px);
    }

    .btn-magnetic {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(110px, 11vw, 155px);
      height: clamp(110px, 11vw, 155px);
      background: transparent;
      border: none;
      cursor: none;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* SVG ring with gradient stroke */
    .btn-ring-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      transition: transform 0.6s var(--ease-elastic);
    }

    .btn-ring-svg circle {
      fill: none;
      stroke: url(#ringGrad);
      stroke-width: 1;
      transform-origin: center;
      transition: stroke-width 0.35s ease, opacity 0.35s ease;
    }

    /* Outer halo ring (animated rotate) */
    .btn-ring-svg .ring-halo {
      stroke-width: 0.4;
      stroke: rgba(0, 255, 238, 0.2);
      stroke-dasharray: 4 12;
      animation: rotate-halo 12s linear infinite;
      transform-origin: center;
    }

    @keyframes rotate-halo {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .btn-magnetic:hover .btn-ring-svg circle:first-child {
      stroke-width: 1.5;
    }

    /* Button text */
    .btn-label {
      position: relative;
      z-index: 2;
      font-family: var(--font-mono);
      font-size: clamp(0.42rem, 0.65vw, 0.58rem);
      font-weight: 700;
      letter-spacing: 0.22em;
      line-height: 1.7;
      text-align: center;
      text-transform: uppercase;
      color: var(--silver-bright);
      pointer-events: none;
      transition: color 0.3s ease, letter-spacing 0.3s ease;
    }

    .btn-magnetic:hover .btn-label {
      color: var(--cyan);
      letter-spacing: 0.28em;
    }

    /* ═══════════════════════════════════════════════════
       CORNER DECORATIONS
    ═══════════════════════════════════════════════════ */
    .corner {
      position: fixed;
      z-index: 20;
      font-family: var(--font-mono);
      font-size: clamp(0.45rem, 0.6vw, 0.58rem);
      letter-spacing: 0.14em;
      color: rgba(0, 255, 238, 0.22);
      line-height: 1.6;
      opacity: 0;
      pointer-events: none;
    }

    .corner-tl { top: 2rem; left: 2.5rem; }
    .corner-br { bottom: 2rem; right: 2.5rem; text-align: right; }

    .blink {
      animation: blink 2.2s step-end infinite;
      color: var(--cyan);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ═══════════════════════════════════════════════════
       SCROLL INDICATOR
    ═══════════════════════════════════════════════════ */
    .scroll-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      opacity: 0;
      pointer-events: none;
    }

    .scroll-hint span {
      font-family: var(--font-mono);
      font-size: 0.5rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(0, 255, 238, 0.35);
    }

    .scroll-line {
      width: 1px;
      height: 36px;
      background: linear-gradient(to bottom, rgba(0,255,238,0.55), transparent);
      animation: scroll-breathe 2.2s ease-in-out infinite;
    }

    @keyframes scroll-breathe {
      0%, 100% { transform: scaleY(1); opacity: 0.55; }
      50%       { transform: scaleY(0.4); opacity: 0.15; }
    }

    /* ═══════════════════════════════════════════════════
       IRIDESCENT UTILITY CLASSES  (for future sessions)
    ═══════════════════════════════════════════════════ */
    .grad-text {
      background: var(--grad-holo);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .glass {
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      background: rgba(255,255,255,0.025);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .blend-diff  { mix-blend-mode: difference;  }
    .blend-excl  { mix-blend-mode: exclusion;    }
    .blend-light { mix-blend-mode: screen;       }

    /* ═══════════════════════════════════════════════════
       RESPONSIVE
    ═══════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .hero-name .line:nth-child(2) .line-inner { padding-left: 0; }
      .corner-br { display: none; }
    }
  </style>
</head>
<body>

  <!-- ── NOISE FILM GRAIN ───────────────────────────── -->
  <div class="noise" aria-hidden="true"></div>

  <!-- ── CUSTOM CURSOR ─────────────────────────────── -->
  <div id="cursor-dot"  aria-hidden="true"></div>
  <div id="cursor-ring" aria-hidden="true"></div>

  <!-- ── HERO SECTION ──────────────────────────────── -->
  <section id="hero" role="banner">

    <!-- WebGL fluid canvas -->
    <canvas id="canvas-fluid" aria-hidden="true"></canvas>

    <div class="hero-inner">

      <!-- Metadata label -->
      <p class="hero-label" aria-label="Protocolo 001 — Biotecnologia Dermal">
        <span class="label-dot"></span>
        <span>PROTOCOLO 001</span>
        <span class="label-rule"></span>
        <span>BIOTECNOLOGIA DERMAL</span>
      </p>

      <!-- Colossal name -->
      <h1 class="hero-name" aria-label="Ana Beatriz">
        <span class="line"><span class="line-inner">ANA</span></span>
        <span class="line"><span class="line-inner">BEATRIZ</span></span>
      </h1>

      <!-- Descriptor + tagline -->
      <div class="hero-meta">
        <p class="hero-descriptor">Esteticista &middot; Cosmetóloga &middot; Ciência da Pele</p>
        <p class="hero-tagline">Alta Performance &nbsp;/&nbsp; Resultado Clínico &nbsp;/&nbsp; Experiência Sensorial</p>
      </div>

      <!-- CTA Magnetic Button -->
      <div class="cta-wrap">
        <button class="btn-magnetic" id="cta-btn" aria-label="Iniciar Protocolo de Atendimento">

          <svg class="btn-ring-svg" viewBox="0 0 160 160" aria-hidden="true">
            <defs>
              <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#00FFEE" />
                <stop offset="40%"  stop-color="#7B2FFF" />
                <stop offset="75%"  stop-color="#FF00AA" />
                <stop offset="100%" stop-color="#B8C6DB" />
              </linearGradient>
            </defs>
            <!-- Gradient ring -->
            <circle cx="80" cy="80" r="74" />
            <!-- Rotating dashed halo -->
            <circle class="ring-halo" cx="80" cy="80" r="74" />
          </svg>

          <span class="btn-label">INICIAR<br>PROTOCOLO</span>

        </button>
      </div>

    </div><!-- /.hero-inner -->
  </section><!-- /#hero -->

  <!-- ── CORNER DECORATIONS ────────────────────────── -->
  <aside class="corner corner-tl" aria-hidden="true">
    <div>SESSION_01 &nbsp;/&nbsp; HERO</div>
    <div>STATUS: <span class="blink">ATIVO</span></div>
  </aside>

  <aside class="corner corner-br" aria-hidden="true">
    <div>© 2026 PROTOCOLO DERMAL</div>
    <div>LAT&nbsp;−23.5505 &nbsp;/&nbsp; LNG&nbsp;−46.6333</div>
  </aside>

  <!-- ── SCROLL INDICATOR ──────────────────────────── -->
  <div class="scroll-hint" aria-hidden="true">
    <span>SCROLL</span>
    <div class="scroll-line"></div>
  </div>


  <!-- ════════════════════════════════════════════════
       EXTERNAL LIBRARIES
  ════════════════════════════════════════════════ -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>


  <script>
  /* ════════════════════════════════════════════════════════════
     MODULE: WebGL Fluid Simulation  (Three.js + GLSL shaders)
  ════════════════════════════════════════════════════════════ */
  (function FluidModule() {
    'use strict';

    const canvas   = document.getElementById('canvas-fluid');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);

    const scene  = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    /* ── Uniforms ─────────────────────────────────── */
    const U = {
      uTime:       { value: 0.0 },
      uMouse:      { value: new THREE.Vector2(0.5, 0.5) },
      uMouseVel:   { value: new THREE.Vector2(0.0, 0.0) },
      uResolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
    };

    /* ── Vertex shader ───────────────────────────── */
    const vert = /* glsl */`
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position.xy, 0.0, 1.0);
      }
    `;

    /* ── Fragment shader (iridescent fluid) ─────── */
    const frag = /* glsl */`
      precision highp float;

      uniform float uTime;
      uniform vec2  uMouse;
      uniform vec2  uMouseVel;
      uniform vec2  uResolution;
      varying vec2  vUv;

      /* --- Gradient noise hash --- */
      vec2 ghash(vec2 p) {
        p = vec2(dot(p, vec2(127.1, 311.7)),
                 dot(p, vec2(269.5, 183.3)));
        return fract(sin(p) * 43758.5453123) * 2.0 - 1.0;
      }

      /* --- Gradient (Perlin-style) noise --- */
      float gnoise(vec2 p) {
        vec2 i = floor(p);
        vec2 f = fract(p);
        /* Quintic smoothstep */
        vec2 u = f * f * f * (f * (f * 6.0 - 15.0) + 10.0);

        float a = dot(ghash(i + vec2(0.0, 0.0)), f - vec2(0.0, 0.0));
        float b = dot(ghash(i + vec2(1.0, 0.0)), f - vec2(1.0, 0.0));
        float c = dot(ghash(i + vec2(0.0, 1.0)), f - vec2(0.0, 1.0));
        float d = dot(ghash(i + vec2(1.0, 1.0)), f - vec2(1.0, 1.0));

        return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
      }

      /* --- FBM with slight rotation per octave --- */
      float fbm(vec2 p) {
        float v = 0.0, a = 0.52;
        /* 2D rotation: 32° */
        mat2 R = mat2( 0.8480,  0.5300,
                      -0.5300,  0.8480);
        for (int i = 0; i < 6; i++) {
          v += a * gnoise(p);
          p  = R * p * 2.08;
          a *= 0.50;
        }
        return v;
      }

      /* --- Iridescent cosine palette ---
         Maps 0→1 to: deep-violet → cyan → silver → magenta → back   */
      vec3 iriPalette(float t) {
        vec3 a = vec3(0.50, 0.50, 0.50);
        vec3 b = vec3(0.50, 0.50, 0.50);
        vec3 c = vec3(1.00, 1.00, 1.00);
        vec3 d = vec3(0.00, 0.12, 0.28); /* phase → tunes which hues appear */
        return a + b * cos(6.28318 * (c * t + d));
      }

      void main() {
        vec2 uv     = vUv;
        float ratio = uResolution.x / uResolution.y;
        vec2 p      = (uv * 2.0 - 1.0) * vec2(ratio, 1.0);

        float T = uTime * 0.11;

        /* ── Mouse influence ── */
        vec2  m      = (uMouse * 2.0 - 1.0) * vec2(ratio, 1.0);
        float mDist  = length(p - m);
        float mPull  = smoothstep(0.9, 0.0, mDist) * 0.45;

        /* Mouse velocity creates directional ripple */
        vec2 velNorm = normalize(uMouseVel + vec2(0.0001));
        vec2 ripple  = velNorm * mPull * 0.3;

        /* ── Domain warping (3 levels) ── */
        vec2 q = vec2(
          fbm(p + vec2(0.00, 0.00) + T * 1.1),
          fbm(p + vec2(4.80, 1.70) + T * 0.9)
        );
        q += ripple;

        vec2 r = vec2(
          fbm(p + 3.8 * q + vec2(1.70,  9.20) + T * 0.7),
          fbm(p + 3.8 * q + vec2(8.30,  2.80) + T * 0.7)
        );

        float f = fbm(p + 3.5 * r + T * 0.4);

        /* ── Color mapping ── */
        float t = fract((f * 0.5 + 0.5) + T * 0.07);
        vec3 col = iriPalette(t);

        /* Modulate luminosity by fluid depth */
        float depth = smoothstep(-0.6, 0.6, f);
        col *= depth * 0.72;

        /* Mouse glow — warm cyan pulse */
        float pulse = sin(uTime * 2.8) * 0.5 + 0.5;
        col += vec3(0.0, 1.0, 0.93) * mPull * 0.38 * (0.6 + 0.4 * pulse);

        /* Vignette: keep edges dark → "Vantablack frame" */
        float vig = 1.0 - smoothstep(0.42, 1.25, length((uv - 0.5) * 2.0));
        col *= vig;

        /* Gamma — push darks darker for high-contrast look */
        col = pow(max(col, vec3(0.0)), vec3(1.6));

        gl_FragColor = vec4(col, 1.0);
      }
    `;

    /* ── Mesh ─────────────────────────────────────── */
    const mesh = new THREE.Mesh(
      new THREE.PlaneGeometry(2, 2),
      new THREE.ShaderMaterial({ uniforms: U, vertexShader: vert, fragmentShader: frag })
    );
    scene.add(mesh);

    /* ── Mouse tracking ───────────────────────────── */
    let rawX = 0.5, rawY = 0.5;
    let smX  = 0.5, smY  = 0.5;

    window.addEventListener('mousemove', e => {
      rawX = e.clientX / window.innerWidth;
      rawY = 1.0 - e.clientY / window.innerHeight;
    });

    /* ── Resize ───────────────────────────────────── */
    window.addEventListener('resize', () => {
      renderer.setSize(window.innerWidth, window.innerHeight);
      U.uResolution.value.set(window.innerWidth, window.innerHeight);
    });

    /* ── Render loop ──────────────────────────────── */
    const clock = { start: performance.now() };

    (function tick() {
      requestAnimationFrame(tick);

      const t   = (performance.now() - clock.start) * 0.001;
      const lrp = 0.045;

      const newX = smX + (rawX - smX) * lrp;
      const newY = smY + (rawY - smY) * lrp;

      U.uMouseVel.value.set((newX - smX) * 24.0, (newY - smY) * 24.0);
      U.uMouse.value.set(newX, newY);
      U.uTime.value = t;

      smX = newX;
      smY = newY;

      renderer.render(scene, camera);
    })();
  })();


  /* ════════════════════════════════════════════════════════════
     MODULE: Custom Cursor
  ════════════════════════════════════════════════════════════ */
  (function CursorModule() {
    'use strict';

    const dot  = document.getElementById('cursor-dot');
    const ring = document.getElementById('cursor-ring');
    let cx = window.innerWidth  / 2;
    let cy = window.innerHeight / 2;
    let rx = cx, ry = cy;

    window.addEventListener('mousemove', e => {
      cx = e.clientX;
      cy = e.clientY;
      dot.style.left = cx + 'px';
      dot.style.top  = cy + 'px';
    });

    /* Ring follows with inertia */
    (function lerpRing() {
      rx += (cx - rx) * 0.11;
      ry += (cy - ry) * 0.11;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(lerpRing);
    })();

    /* State classes */
    const ctaBtn = document.getElementById('cta-btn');
    if (ctaBtn) {
      ctaBtn.addEventListener('mouseenter', () => document.body.classList.add('cursor-on-cta'));
      ctaBtn.addEventListener('mouseleave', () => document.body.classList.remove('cursor-on-cta'));
    }

    /* Hide when leaving window */
    document.addEventListener('mouseleave', () => {
      dot.style.opacity  = '0';
      ring.style.opacity = '0';
    });
    document.addEventListener('mouseenter', () => {
      dot.style.opacity  = '1';
      ring.style.opacity = '1';
    });
  })();


  /* ════════════════════════════════════════════════════════════
     MODULE: Magnetic Button
  ════════════════════════════════════════════════════════════ */
  (function MagneticModule() {
    'use strict';
    if (typeof gsap === 'undefined') return;

    const btn      = document.getElementById('cta-btn');
    if (!btn) return;

    const PULL     = 0.38;
    const PULL_SVG = 0.18; /* inner SVG moves less for parallax depth */

    btn.addEventListener('mousemove', e => {
      const r   = btn.getBoundingClientRect();
      const dx  = e.clientX - (r.left + r.width  / 2);
      const dy  = e.clientY - (r.top  + r.height / 2);

      gsap.to(btn, {
        x: dx * PULL, y: dy * PULL,
        duration: 0.5, ease: 'power3.out'
      });
      gsap.to(btn.querySelector('.btn-ring-svg'), {
        x: dx * PULL_SVG, y: dy * PULL_SVG,
        duration: 0.6, ease: 'power3.out'
      });
    });

    btn.addEventListener('mouseleave', () => {
      gsap.to(btn, { x: 0, y: 0, duration: 0.9, ease: 'elastic.out(1, 0.45)' });
      gsap.to(btn.querySelector('.btn-ring-svg'), {
        x: 0, y: 0, duration: 0.8, ease: 'elastic.out(1, 0.5)'
      });
    });

    /* Click ripple burst */
    btn.addEventListener('click', () => {
      gsap.timeline()
        .to(btn, { scale: 0.92, duration: 0.12, ease: 'power2.in' })
        .to(btn, { scale: 1.0,  duration: 0.5,  ease: 'elastic.out(1.2, 0.5)' });
    });
  })();


  /* ════════════════════════════════════════════════════════════
     MODULE: Entrance Animation  (GSAP)
  ════════════════════════════════════════════════════════════ */
  (function EntranceModule() {
    'use strict';
    if (typeof gsap === 'undefined') return;

    const tl = gsap.timeline({
      defaults: { ease: 'power4.out' },
      delay: 0.25
    });

    /* 1. Name lines slide up from clip */
    tl.to('.hero-name .line-inner', {
      y: 0,
      duration: 1.35,
      stagger: 0.14
    })

    /* 2. Metadata label fades in */
    .to('.hero-label', {
      opacity: 1,
      y: 0,
      duration: 1.1
    }, '-=0.8')

    /* 3. Descriptor */
    .to('.hero-descriptor', {
      opacity: 1,
      y: 0,
      duration: 0.85
    }, '-=0.55')

    /* 4. Tagline */
    .to('.hero-tagline', {
      opacity: 1,
      y: 0,
      duration: 0.8
    }, '-=0.55')

    /* 5. CTA Button */
    .to('.cta-wrap', {
      opacity: 1,
      y: 0,
      duration: 0.9
    }, '-=0.4')

    /* 6. Corner chrome & scroll hint */
    .to(['.corner', '.scroll-hint'], {
      opacity: 1,
      duration: 1.1,
      stagger: 0.12
    }, '-=0.45');
  })();


  /* ════════════════════════════════════════════════════════════
     MODULE: Lenis Smooth Scroll  (prepared for Sessions 02–05)
  ════════════════════════════════════════════════════════════ */
  (function LenisModule() {
    'use strict';
    if (typeof Lenis === 'undefined') return;

    const lenis = new Lenis({
      duration:  1.45,
      easing:    t => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
      smooth:    true,
      direction: 'vertical'
    });

    (function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    })(performance.now());

    window.__lenis = lenis; /* expose for future session modules */
  })();
  </script>
